<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>demo</title>
<link rel="stylesheet" href="../shared/theme.css"></head><body><div id="app"></div>
<script src="../shared/vendor/chart.umd.min.js"></script><script src="../shared/kit.js"></script>
<script>
const r=({el,data,Kit})=>{const geos=Kit.uniq(data.rows,"geo");const k=document.createElement("div");k.className="grid kpis";const f=document.createElement("div");f.className="filters";const c=document.createElement("div");c.className="grid charts";el.append(f,k,c);
Kit.insight(el,"Demo insight");
const draw=(g)=>{Kit.destroyAll();k.innerHTML="";c.innerHTML="";const rows=data.rows.filter(x=>x.geo===g);const l=Kit.latest(rows);const p=Kit.pivot(rows);
[1,2,3].forEach(i=>Kit.kpi(k,{label:"K"+i,value:l.value,unit:"%",delta:2}));
let a=Kit.chartCard(c,{title:"Line",span:8});Kit.chart(a.canvas,{labels:p.labels,series:p.names.map(n=>({name:n,data:p.map[n]}))});
a=Kit.chartCard(c,{title:"Bar",span:4});Kit.chart(a.canvas,{type:"bar",labels:p.labels,series:[{name:"X",data:p.map.X}]});
Kit.table(c,{title:"T",columns:[{key:"period",label:"P"},{key:"value",label:"V"}],rows});};
Kit.select(f,{label:"Country",options:geos,value:geos[0],onChange:draw});draw(geos[0]);};
Kit.mount({country:"demo",title:"Demo",subtitle:"sub",topics:[{id:"a",title:"A",render:r},{id:"b",title:"B",render:r},{id:"c",title:"C",render:r}]});
</script></body></html>
