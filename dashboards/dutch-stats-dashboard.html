<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dutch Statistics Dashboard</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="page-dutch">
    <header>
        <div>
            <h1>Dutch Statistics Dashboard</h1>
            <p class="page-tagline">Nation-level trend view for local model usage and engagement</p>
        </div>
        <nav>
            <button id="darkModeToggle">🌙</button>
        </nav>
    </header>

    <main>
        <aside>
            <div id="controls">
                <h3>Filters</h3>
                <label for="yearFilter">Year:</label>
                <select id="yearFilter">
                    <option value="all">All Years</option>
                </select>

                <label for="metricFilter">Metric:</label>
                <select id="metricFilter">
                    <option value="all">All Metrics</option>
                    <option value="chat_count">Chat Count</option>
                    <option value="user_count">User Count</option>
                </select>

                <button id="applyFilters">Apply Filters</button>
                <button id="resetFilter" type="button">Reset</button>
            </div>

            <div id="navigation">
                <h3>Dashboard Navigation</h3>
                <ul>
                    <li><a href="../index.html">Local LLM Model Dashboard</a></li>
                    <li><a href="dutch-stats-dashboard.html" class="active">Dutch Statistics Dashboard</a></li>
                    <li><a href="cbs-dashboard.html">CBS NL Data Dashboard</a></li>
                </ul>
            </div>
        </aside>

        <div id="chartContainer">
            <canvas id="dutchTrendChart"></canvas>
            <canvas id="dutchComparisonChart"></canvas>
            <canvas id="dutchDistributionChart"></canvas>
        </div>
    </main>

    <footer>
        <p>Dutch Statistics Dashboard | 🤖 Generated with Ollama + Claude Code</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="dutch-stats-scripts.js"></script>
</body>
</html>
